[package]
name = "cme_mdp3_pcap_dump"
version = "0.1.0"
edition = "2021"
publish = false

description = "CME MDP3 pcap dump example using sbe_gen"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
pcap = "2.4.0"
zerocopy = { version = "0.8", features = ["derive"] }

[build-dependencies]
sbe_gen = { path = "../.." }
