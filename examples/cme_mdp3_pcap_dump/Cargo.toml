[workspace]


[package]
name = "cme_mdp3_pcap_dump"
version = "0.1.0"
edition = "2024"
publish = false

description = "CME MDP3 pcap dump example using sbe_gen"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
pcap = "2.4.0"
zerocopy = { version = "0.8", features = ["derive"] }
sbe_support = { path = "../../sbe_support", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
primitive_fixed_point_decimal = { version = "1.5.0", features = ["serde"] }
chrono = { version = "0.4.45", default-features = false, features = ["serde", "alloc"] }

[build-dependencies]
sbe_gen = { path = "../.." }
