[package]
name = "sbe_gen"
version = "0.7.2"
edition = "2024"
authors = ["Your Name <you@example.com>"]
description = "Simple Binary Encoding (SBE) code generator for Rust using zerocopy"
license = "MIT OR Apache-2.0"
readme = "README.md"

[dependencies]
roxmltree = "0.19"
thiserror = "1.0"
heck = "0.4"
clap = { version = "4.1", features = ["derive"] }

[dev-dependencies]
tempfile = "3"
