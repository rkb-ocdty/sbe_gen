[package]
name = "sbe_gen_derive"
version = "0.7.3"
edition = "2024"
description = "Derive macros for code generated by sbe_gen"
license = "MIT OR Apache-2.0"

[lib]
proc-macro = true

[dependencies]
syn = { version = "3", features = ["full"] }
proc-macro2 = "1.0.107"
quote = "1.0.47"
darling = "0.24"
heck = "0.5"
